spring.application.name=ai-dev-assistent

# Database (PostgreSQL + pgvector)
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_assistant_db
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Spring AI - Ollama (DeepSeek Coder & Nomic Embed)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=deepseek-coder:6.7b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Spring AI - OpenAI / DeepSeek API (Alternative / Optional via OpenAI-compatible endpoint)
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:placeholder-key}
spring.ai.openai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=deepseek-chat

# Spring AI - pgvector VectorStore configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=INFO
logging.level.com.example.ai_dev_assistent=DEBUG
logging.level.org.springframework.ai=INFO